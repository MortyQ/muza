name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, types, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The libs have to be built before the dashboard type-checks against them.
      - run: pnpm build:libs

      - name: Type-check the library
        run: pnpm --filter @muzakit/ui type-check

      - name: Type-check the dashboard
        run: pnpm --filter @muzakit/dashboard exec vue-tsc --noEmit

      - name: Lint
        run: pnpm exec eslint libs apps

      - name: Unit tests and coverage
        run: pnpm --filter @muzakit/ui test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: libs/ui/coverage
          retention-days: 7

  visual:
    name: token contracts + pixel regression
    runs-on: ubuntu-latest
    # MUST match the `playwright` version in pnpm-lock.yaml. A different
    # Chromium renders text differently and invalidates every baseline at once —
    # bump this and the dependency in the same commit, then regenerate the
    # baselines with the visual-baselines workflow.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The two halves of the browser project are split because they fail for
      # different reasons and deserve different answers.
      #
      # A token contract compares a component against the value the browser
      # actually computed for its `--ui-*` token. It has no baseline to go
      # stale, so a red one is always a real defect. It gates.
      - name: Token contracts
        run: pnpm --filter @muzakit/ui test:tokens

      # Pixel regression is only as trustworthy as the last time someone
      # regenerated the baselines, and it goes red for reasons that have nothing
      # to do with the PR under review: a Chromium bump, a font, a deliberate
      # restyle landed two commits ago, or — as when this split was written — a
      # baseline set that does not exist yet. Gating on that trains people to
      # merge through a red check, which costs more than the signal is worth.
      #
      # So it reports instead. Read the summary, pull the diff artifact, and
      # regenerate deliberately with the visual-baselines workflow. To make it
      # gate again once the baselines are trustworthy, drop `continue-on-error`.
      - name: Pixel regression (reported, not enforced)
        id: pixels
        continue-on-error: true
        run: pnpm --filter @muzakit/ui test:screenshots

      - name: Surface the pixel result
        if: steps.pixels.outcome == 'failure'
        run: |
          echo "::warning title=Pixel regression::Screenshots differ from the committed baselines. Download the visual-diffs artifact, and regenerate with the Update visual baselines workflow if the change was intended."
          echo "### Pixel regression reported differences" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This does not fail the build. Check the \`visual-diffs\` artifact." >> "$GITHUB_STEP_SUMMARY"

      # Without the diff images a failure here is unreadable: the log says two
      # PNGs differ and nothing else. `failure()` would not fire for the
      # reported step, so this keys off its outcome directly.
      - uses: actions/upload-artifact@v4
        if: always() && steps.pixels.outcome == 'failure'
        with:
          name: visual-diffs
          path: libs/ui/.vitest-attachments
          retention-days: 7
