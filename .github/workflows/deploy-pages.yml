name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, but a deploy
# already in flight is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: pnpm build
        env:
          # e.g. /muza/ — the path Pages serves the project site from
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # No dev-server proxy on Pages, so the app calls the backend directly.
          # Set it under Settings → Secrets and variables → Actions → Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # The dedicated demo account behind "Log in as test user", from the
          # repository variables. Every `VITE_` value is inlined into the public
          # bundle anyway, so this must only ever be an account with nothing
          # worth protecting. Unset, the button does not render.
          VITE_DEMO_EMAIL: ${{ vars.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ vars.VITE_DEMO_PASSWORD }}

      # Pages has no rewrites. Every known route gets its own copy of the app
      # shell as `<route>.html`, which Pages serves for `/<route>` with no
      # trailing-slash redirect, so a deep link or a refresh answers 200 rather
      # than 404 (a 404
      # status is logged as a console error, and crawlers and Lighthouse treat
      # the page as missing). 404.html stays as the fallback for anything else,
      # including routes added later and not listed here.
      - name: SPA routes
        working-directory: apps/muzakit-dashboard/dist
        run: |
          cp index.html 404.html
          for route in auth home analytics components-demo table-demo 403 \
            reports/overview reports/monthly reports/custom reports/quarterly/q1 reports/quarterly/q2 \
            settings/profile settings/team settings/billing \
            settings/account/security settings/account/notifications; do
            mkdir -p "$(dirname "$route")"
            cp index.html "$route.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/muzakit-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
